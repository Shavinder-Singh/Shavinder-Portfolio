<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f4f4;
        padding: 20px;
    }

    .login-box {
        width: 100%;
        max-width: 400px;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .login-box h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .login-box input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
    }

    .login-box button {
        width: 100%;
        padding: 12px;
        border: none;
        background: black;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }
</style>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        <input type="email" id="email" placeholder="Enter Email">

        <input type="password" id="password" placeholder="Enter Password">

        <button id="loginBtn">
            Login
        </button>

    </div>

    <script type="module" src="./loginSignup.js"></script>

    
</body>

</html>
